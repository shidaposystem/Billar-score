</style><meta name="description" content="Billar Score para iPad: jugadores, bolas, historial y ranking; archivo independiente."></head><body data-theme="green"><div class="shell"><header class="top"><div class="brand"><b>●</b> BILLAR SCORE</div><div class="top-actions"><button id="playersBtn">Jugadores</button><button id="rankingBtn">Ranking</button><button id="historyBtn">Historial</button><button id="settingsBtn">⚙ Ajustes</button></div></header><div class="layout"><section class="panel"><div class="section-head"><h2>Marcador</h2><span class="pill" id="roundLabel">Partida 1</span></div><div class="active-card"><div><div class="muted">JUGADOR SELECCIONADO</div><div class="name" id="activeName"></div><div class="muted" id="activeWins"></div><div class="smallballs" id="activeBalls"></div></div><div style="text-align:right"><div class="bigscore" id="activeScore">0</div><div class="muted">PUNTOS</div></div></div><div class="section-head"><h2>Jugadores</h2><span class="muted">Toca para seleccionar</span></div><div class="players" id="players"></div></section><section class="panel"><div class="section-head"><h2>Bolas disponibles</h2><span class="pill" id="remain"></span></div><div class="stats"><div class="stat"><strong id="totalPoints">0</strong><small>de 120 puntos</small></div><div class="stat"><strong id="ballsLeft">15</strong><small>bolas restantes</small></div></div><div class="ballgrid" id="balls"></div><div class="actions"><button id="undo">↶ Deshacer</button><button class="primary" id="finish">Terminar juego</button></div><p class="notice">Cada bola vale su número. Solo se puede registrar una vez. Se guarda cada movimiento automáticamente.</p></section></div></div><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="buttons" id="dialogButtons"></div></div></div><script>
'use strict';const OLD='billar-score-v1',KEY='billar-score-ipad-v2';const $=id=>document.getElementById(id);const color=['#e9c22c','#2365bd','#c9363e','#7541a7','#ee822a','#278850','#8c432d','#181b20','#e9c22c','#2365bd','#c9363e','#7541a7','#ee822a','#278850','#8c432d'];const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const defaults=()=>({version:2,profiles:Array.from({length:3},(_,i)=>({id:uid(),name:'Jugador '+(i+1)})),selected:[],active:0,balls:[],moves:[],wins:{},results:[],round:1,theme:'green',sound:true,sessionStarted:false});let s;try{s=JSON.parse(localStorage.getItem(KEY))||null}catch{}if(!s){s=defaults();s.selected=s.profiles.map(p=>p.id);try{const o=JSON.parse(localStorage.getItem(OLD)||'null');if(o){const n=Math.max(2,Math.min(4,Number(o.count)||3));s.profiles=Array.from({length:Math.max(n,4)},(_,i)=>({id:uid(),name:String(o.names?.[i]||'Jugador '+(i+1))}));s.selected=s.profiles.slice(0,n).map(p=>p.id);s.active=Math.min(n-1,Number(o.active)||0);s.wins=Object.fromEntries(s.profiles.map((p,i)=>[p.id,Number(o.wins?.[i])||0]));s.balls=(o.history||[]).filter(x=>x.n>=1&&x.n<=15).map(x=>({n:x.n,id:s.selected[x.player]||s.selected[0]}));s.moves=[...s.balls];s.sessionStarted=s.balls.length>0}}catch{}}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{alert('No se pudo guardar. Comprueba el espacio disponible.')}}function profile(id){return s.profiles.find(p=>p.id===id)}function name(id){return profile(id)?.name||'Jugador'}function score(id){return s.balls.filter(b=>b.id===id).reduce((a,b)=>a+b.n,0)}function ballsOf(id){return s.balls.filter(b=>b.id===id).map(b=>b.n)}function current(){return s.selected[Math.min(s.active,s.selected.length-1)]}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function mini(n){return `<span class="mini" style="--ball-color:${color[n-1]}" title="Bola ${n}">${n}</span>`}function render(){document.body.dataset.theme=s.theme;const id=current();$('activeName').textContent=name(id);$('activeWins').textContent=(s.wins[id]||0)+' victorias en esta sesión';$('activeScore').textContent=score(id);$('activeBalls').innerHTML=ballsOf(id).map(mini).join('');$('roundLabel').textContent='Partida '+s.round;const ps=$('players');ps.replaceChildren();s.selected.forEach((pid,i)=>{const b=document.createElement('button');b.className='player'+(i===s.active?' selected':'');b.innerHTML=`<div class="pname">${esc(name(pid))}</div><div class="pmeta"><span class="pscore">${score(pid)}</span><span class="pill">${s.wins[pid]||0} victorias</span></div><div class="pballs">${ballsOf(pid).map(mini).join('')}</div>`;b.onclick=()=>{s.active=i;save();render()};ps.append(b)});const total=s.balls.reduce((a,b)=>a+b.n,0);$('totalPoints').textContent=total;$('ballsLeft').textContent=15-s.balls.length;$('remain').textContent=(15-s.balls.length)+'/15';const bs=$('balls');bs.replaceChildren();for(let n=1;n<=15;n++){const used=s.balls.some(b=>b.n===n),b=document.createElement('button');b.className='ballbtn'+(used?' used':'');b.setAttribute('aria-label','Bola '+n+(used?', registrada, tocar para quitar':', '+n+' puntos'));b.innerHTML=`<div class="ball ${n>8?'stripe':''}" style="--ball-color:${color[n-1]}"><span>${n}</span></div><small>${used?'Tocar para quitar':'+'+n+' pts'}</small>`;b.onclick=()=>{if(used){const i=s.balls.findIndex(x=>x.n===n);if(i>=0)s.balls.splice(i,1);s.moves=s.moves.filter(x=>x.n!==n);save();render();return;}const id=current();s.balls.push({n,id});s.moves.push({n,id});s.sessionStarted=true;save();tone();render()};bs.append(b)}$('undo').disabled=!s.moves.length;$('finish').disabled=!s.balls.length}let audio;function tone(){if(!s.sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.setValueAtTime(480,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(190,audio.currentTime+.075);gain.gain.setValueAtTime(.06,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.1);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.1)}catch{}}function dialog(title,html,buttons){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=html;$('dialogButtons').replaceChildren();buttons.forEach(x=>{const b=document.createElement('button');b.textContent=x.label;if(x.primary)b.className='primary';b.onclick=()=>{if(x.action)x.action();if(!x.keep)closeDialog()};$('dialogButtons').append(b)});$('overlay').classList.add('show')}function closeDialog(){$('overlay').classList.remove('show')}function confirmAction(title,msg,fn){dialog(title,`<p>${esc(msg)}</p>`,[{label:'Cancelar'},{label:'Confirmar',primary:true,action:fn}])}function resetRound(){s.balls=[];s.moves=[];s.active=0;s.round++;save();render()}$('undo').onclick=()=>{const x=s.moves.pop();if(!x)return;const idx=s.balls.findLastIndex(b=>b.n===x.n&&b.id===x.id);if(idx>=0)s.balls.splice(idx,1);save();render()};$('finish').onclick=()=>{const scores=s.selected.map(id=>({id,points:score(id)}));const max=Math.max(...scores.map(x=>x.points));const winners=scores.filter(x=>x.points===max);const label=winners.length===1?`Ganador: ${name(winners[0].id)} con ${max} puntos.`:`Empate entre ${winners.map(x=>name(x.id)).join(', ')} con ${max} puntos. No se asignará victoria.`;confirmAction('Terminar partida',label+' ¿Guardar el resultado y comenzar otra?',()=>{if(winners.length===1)s.wins[winners[0].id]=(s.wins[winners[0].id]||0)+1;s.results.unshift({date:new Date().toISOString(),round:s.round,players:s.selected.map(id=>({id,name:name(id),points:score(id),balls:ballsOf(id)})),winner:winners.length===1?winners[0].id:null});resetRound()})};function playerDialog(){const rows=s.profiles.map(p=>`<div class="listrow"><label><input type="checkbox" class="pick" value="${p.id}" ${s.selected.includes(p.id)?'checked':''}> <span>${esc(p.name)}</span></label><button class="rename" data-id="${p.id}">Editar</button></div>`).join('');dialog('Jugadores',`<p>Selecciona entre 2 y 8 jugadores. Los perfiles se guardan en este iPad.</p><div id="profileRows">${rows}</div><div class="field"><label>Nuevo jugador</label><input id="newName" maxlength="35" placeholder="Nombre"></div><button id="addProfile">+ Guardar jugador</button>`,[{label:'Cerrar'},{label:'Aplicar selección',primary:true,keep:true,action:()=>{const ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);if(ids.length<2||ids.length>8){alert('Selecciona de 2 a 8 jugadores.');return}const apply=()=>{s.selected=ids;s.active=0;s.balls=[];s.moves=[];s.round=1;s.wins=Object.fromEntries(ids.map(id=>[id,0]));s.sessionStarted=false;save();closeDialog();render()};if(s.balls.length||s.results.length)confirmAction('Nueva sesión','Cambiar jugadores inicia una sesión nueva y reinicia las victorias. El ranking histórico se conserva.',apply);else apply()}}]);$('addProfile').onclick=()=>{const n=$('newName').value.trim();if(!n)return;if(s.profiles.length>=60){alert('Máximo 60 perfiles guardados.');return}s.profiles.push({id:uid(),name:n});save();playerDialog()};document.querySelectorAll('.rename').forEach(b=>b.onclick=()=>{const p=profile(b.dataset.id);const n=prompt('Nombre del jugador',p.name);if(n?.trim()){p.name=n.trim().slice(0,35);save();playerDialog();render()}})}$('playersBtn').onclick=playerDialog;function historyDialog(){const rows=s.results.slice(0,100).map(r=>`<div class="listrow"><div><strong>Partida ${r.round} · ${new Date(r.date).toLocaleDateString('es-MX')}</strong><div class="muted">${r.winner?'Ganó '+esc(r.players.find(p=>p.id===r.winner)?.name||'Jugador'):'Empate'} · ${r.players.map(p=>esc(p.name)+' '+p.points).join(' · ')}</div></div></div>`).join('');dialog('Historial de partidas',rows||'<p>Aún no hay partidas terminadas.</p>',[{label:'Cerrar'}])}$('historyBtn').onclick=historyDialog;function rankingDialog(){const map=new Map();s.results.forEach(r=>r.players.forEach(p=>{const o=map.get(p.id)||{name:p.name,played:0,wins:0,points:0};o.played++;o.points+=p.points;if(r.winner===p.id)o.wins++;map.set(p.id,o)}));const rows=[...map.values()].sort((a,b)=>b.wins-a.wins||b.points-a.points).map((p,i)=>`<div class="listrow"><div><strong>${i+1}. ${esc(p.name)}</strong><div class="muted">${p.played} juegos · ${p.points} puntos · ${p.played?Math.round(p.wins/p.played*100):0}% victorias</div></div><strong>${p.wins} ganadas</strong></div>`).join('');dialog('Ranking histórico',rows||'<p>El ranking aparecerá después de terminar la primera partida.</p>',[{label:'Cerrar'}])}$('rankingBtn').onclick=rankingDialog;function settingsDialog(){dialog('Ajustes',`<div class="field"><label>Tema</label><select id="theme"><option value="green">Verde billar</option><option value="gold">Negro y dorado</option><option value="blue">Azul nocturno</option></select></div><label class="listrow"><span>Sonido discreto</span><input id="sound" type="checkbox"></label><p class="muted">El guardado es automático. La pantalla puede mantenerse encendida mientras el navegador admita esta función.</p><div class="listrow"><span>Nueva partida (mantener victorias)</span><button id="newRound">Iniciar</button></div><div class="listrow"><span>Nueva sesión (reiniciar victorias)</span><button id="newSession">Iniciar</button></div><div class="listrow"><span>Borrar historial y ranking</span><button id="eraseHistory">Borrar</button></div><div class="listrow"><span>Exportar copia de seguridad</span><button id="backup">Exportar</button></div><div class="listrow"><span>Importar copia de seguridad</span><input type="file" id="restore" accept="application/json,.json" style="max-width:160px"></div>`,[{label:'Cerrar'}]);$('theme').value=s.theme;$('sound').checked=s.sound;$('theme').onchange=e=>{s.theme=e.target.value;save();render()};$('sound').onchange=e=>{s.sound=e.target.checked;save()};$('newRound').onclick=()=>confirmAction('Nueva partida','Se borrarán las bolas de la partida actual, per let wake=null;async function wakeLock(){try{if('wakeLock'in navigator&&!wake)wake=await navigator.wakeLock.request('screen')}catch{}}document.addEventListener('visibilitychange',()=>{if(!document.hidden)wakeLock()});document.addEventListener('pointerdown',()=>wakeLock(),{once:true});if('serviceWorker'in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});render();if(s.sessionStarted&&s.balls.length){dialog('Partida sin terminar',`<p>Hay una partida guardada con ${s.balls.length} bolas registradas. ¿Quieres continuar donde te quedaste?</p>`,[{label:'Nueva partida',action:()=>{resetRound()}},{label:'Continuar',primary:true}])}
